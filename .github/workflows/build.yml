name: CI Build

on:
  push:
    # Build-only on every branch EXCEPT main and snapshot (those release/publish via
    # their dedicated workflows). All other branches only verify.
    branches-ignore:
      - main
      - snapshot
  pull_request:
    branches:
      - '*'

# Least privilege by default; this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@4c8b1daf597d0ae439253b59c42d7e52049d5137 # v1.1.2
    with:
      # bnd resolve/export tasks are not parallel-safe in this workspace.
      gradle-parallel: false
      # Validate that ALL THREE runtime bndruns still resolve, and that the image exports.
      # A -runbundles entry can resolve locally out of ~/.m2 and be in no index a clean runner
      # can fetch from (see CLAUDE.md for the three ways); resolving here is what catches it.
      # inference.bndrun additionally needs egress to the DIM nexus, which hosts the only
      # published copy of the four fennec-ai chat-completion bundles.
      extra-gradle-tasks: >-
        org.eclipse.fennec.event.atlas.mapping.runtime:resolve.launch
        org.eclipse.fennec.event.atlas.mapping.runtime:resolve.inference
        org.eclipse.fennec.event.atlas.mapping.runtime:export.eventatlas.runtime_docker
