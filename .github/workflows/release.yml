name: Release Build

on:
  push:
    branches:
      - main

# Workflow-level ceiling for the called reusables. Only the docs deploy needs the
# pages/id-token scopes; the credential-scoped release and container steps get their
# secrets via `secrets: inherit` below (verify + docs never see them); packages: write
# is needed for the GHCR image push.
permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@9292fbff296548018fa9e4b0f6ad49ba7c639501 # v1.1.1

  release:
    needs: verify
    uses: eclipse-fennec/.github/.github/workflows/reusable-release.yml@9292fbff296548018fa9e4b0f6ad49ba7c639501 # v1.1.1
    with:
      do-release: true
      # bnd resolve/export tasks are not parallel-safe in this workspace.
      gradle-parallel: false
      # Export the docker runtime jar in the SAME build that publishes to Maven,
      # and hand it to the container job as the release-jars artifact.
      extra-gradle-tasks: >-
        org.eclipse.fennec.event.atlas.mapping.runtime:export.eventatlas.runtime_docker
      artifact-paths: |
        org.eclipse.fennec.event.atlas.mapping.runtime/generated/distributions/executable/eventatlas.runtime_docker.jar
        org.eclipse.fennec.event.atlas.mapping/generated/org.eclipse.fennec.event.atlas.mapping.jar
    secrets: inherit

  container:
    needs: release
    uses: ./.github/workflows/reusable-container.yml
    with:
      docker-label: latest
    secrets: inherit

  docs:
    needs: release
    uses: eclipse-fennec/.github/.github/workflows/reusable-docs.yml@9292fbff296548018fa9e4b0f6ad49ba7c639501 # v1.1.1
