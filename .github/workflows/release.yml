name: Release Build

on:
  push:
    branches:
      - main

# Workflow-level ceiling for the called reusables. Only the docs deploy needs the
# pages/id-token scopes; the credential-scoped release and container steps get their
# secrets via `secrets: inherit` below (verify + docs never see them); packages: write
# is needed for the GHCR image push.
permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@4c8b1daf597d0ae439253b59c42d7e52049d5137 # v1.1.2

  release:
    needs: verify
    uses: eclipse-fennec/.github/.github/workflows/reusable-release.yml@2a98ad6e2459556b858e1273bff2f8d87fc11a06 # v1.3.0
    with:
      do-release: true
      # bnd resolve/export tasks are not parallel-safe in this workspace.
      gradle-parallel: false
      # Export the docker runtime jar in the SAME build that publishes to Maven,
      # and hand it to the container job as the release-jars artifact.
      extra-gradle-tasks: >-
        org.eclipse.fennec.event.atlas.mapping.runtime:export.eventatlas.runtime_docker
      artifact-paths: |
        org.eclipse.fennec.event.atlas.mapping.runtime/generated/distributions/executable/eventatlas.runtime_docker.jar
        org.eclipse.fennec.event.atlas.mapping/generated/org.eclipse.fennec.event.atlas.mapping.jar
    secrets: inherit

  # The image is built from the release-jars artifact of the release job above,
  # so the jar it embeds is the jar published to Maven in that same Gradle
  # invocation. Declarative staging: the runtime jar plus the runtime tree
  # (eclipse-fennec/.github, docs/ci-cd-reusable-workflows.md §5.7).
  container:
    needs: release
    uses: eclipse-fennec/.github/.github/workflows/reusable-container.yml@074409595cdb7f4afc3c3ab521fe720b05f913b3 # eclipse-fennec/.github#43
    with:
      image-name: event.atlas
      docker-label: latest
      docker-context: docker/eventatlas
      runtime-jar: eventatlas.runtime_docker.jar
      runtime-dir: org.eclipse.fennec.event.atlas.mapping.runtime/runtime
      version-jar: org.eclipse.fennec.event.atlas.mapping.jar
    secrets: inherit

  docs:
    needs: release
    uses: eclipse-fennec/.github/.github/workflows/reusable-docs.yml@2a98ad6e2459556b858e1273bff2f8d87fc11a06 # v1.3.0
