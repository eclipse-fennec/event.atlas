name: Reusable Container Deploy

# Repo-local reusable: builds/pushes the Event Atlas mapping runtime image to Docker Hub
# and GHCR. The runtime jar is NOT rebuilt here — it is downloaded from the
# "release-jars" artifact uploaded by reusable-release (eclipse-fennec/.github v1.1.0+:
# extra-gradle-tasks and artifact-paths inputs), so the image embeds exactly the jar
# that was built alongside the Maven publish. The moving tag label (snapshot vs latest)
# comes from the calling workflow.
on:
  workflow_call:
    inputs:
      docker-label:
        description: 'Moving docker tag label, e.g. snapshot or latest.'
        type: string
        required: true
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_API_TOKEN:
        required: true

permissions:
  contents: read

env:
  LC_ALL: en_US.UTF-8

defaults:
  run:
    shell: bash

jobs:
  container:
    name: Container Deploy (${{ inputs.docker-label }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Git Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - name: Download Release Artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-jars
          path: .
      - name: Install bnd
        run: |
          curl -Lk -o /tmp/biz.aQute.bnd.jar \
            https://repo1.maven.org/maven2/biz/aQute/bnd/biz.aQute.bnd/7.2.1/biz.aQute.bnd-7.2.1.jar
      - name: Extract Bundle Version
        id: bundle_version
        run: |
          VERSION=$(java -jar /tmp/biz.aQute.bnd.jar select -h Bundle-Version \
            org.eclipse.fennec.event.atlas.mapping/generated/org.eclipse.fennec.event.atlas.mapping.jar \
            2>/dev/null | head -1)
          echo "VERSION=${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Prepare Docker content
        run: |
          mkdir -p docker/eventatlas/content
          cp org.eclipse.fennec.event.atlas.mapping.runtime/generated/distributions/executable/eventatlas.runtime_docker.jar docker/eventatlas/content/eventatlas.runtime_docker.jar
          cp -rf org.eclipse.fennec.event.atlas.mapping.runtime/runtime docker/eventatlas/content/runtime
          ls -lR docker/eventatlas/content
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Login to Docker Hub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_API_TOKEN }}
      - name: Login to Github Docker Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/eventatlas/
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |-
            docker.io/eclipsefennec/event.atlas:${{ inputs.docker-label }}
            docker.io/eclipsefennec/event.atlas:${{ steps.bundle_version.outputs.version }}
            ghcr.io/eclipse-fennec/event.atlas:${{ inputs.docker-label }}
            ghcr.io/eclipse-fennec/event.atlas:${{ steps.bundle_version.outputs.version }}
